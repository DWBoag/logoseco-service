# Render Blueprint for the standalone LOGOSECO service.
# Independent authority: separate service, separate failure domain from Horus.
# The Ed25519 PRIVATE signing key lives ONLY here, set in the dashboard as a secret.
services:
  - type: web
    name: logoseco-service
    runtime: python
    plan: free            # upgrade for always-on; free spins down when idle
    region: singapore     # closest Render region to NZ/AU
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LOGOSECO_POLICY_VERSION
        value: "v1"
      - key: LOGOSECO_PRIVATE_KEY_PEM
        sync: false       # Ed25519 PKCS8 PEM — the signing key. NEVER in the repo.
      - key: LOGOSECO_APPROVER_TOKEN
        sync: false       # bearer for the human-approval endpoint (Stage-1b hardening planned)
      - key: SUPABASE_URL
        sync: false       # the service's OWN Supabase project (audit/deliberation store)
      - key: SUPABASE_SERVICE_KEY
        sync: false
